services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asl_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro        # mount model files (read-only)
    environment:
      - MODEL_PATH=models/best.onnx
      - INPUT_SIZE=416
    healthcheck:
      # python:3.11-slim n'a pas curl : on teste avec Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL de l'API vue depuis le NAVIGATEUR (pas depuis le reseau Docker)
        VITE_API_URL: http://localhost:8000
    container_name: asl_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: asl_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
      --default-artifact-root /mlflow/mlruns/artifacts
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

networks:
  default:
    name: asl_network
